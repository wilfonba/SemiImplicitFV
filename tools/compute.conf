# Compute environment definitions.
# Each section [name] defines a compute environment with:
#   - key = value lines for metadata (e.g., submit = sbatch)
#   - bare lines for module commands (executed by: ./sifv.sh load -c <name>)
#
# To add a new environment, create a new [name] section below
# and a matching template in tools/templates/<name>.sh.

[phoenix]
submit = sbatch
module purge
module load gcc/12.3.0 openmpi/4.1.5 python/3.12.5

[phoenix-gpu]
submit = sbatch
module purge
module load nvhpc/25.5 python/3.12.5 openmpi/4.1.5
